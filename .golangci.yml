# Restores golangci-lint v1's default EXC0001 errcheck exclusions
# (dropped when this repo's config moved to v2 schema).
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - exhaustive
    - errorlint
    - nilerr
    - bodyclose
    - gosec
    - modernize
  settings:
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: '_test\.go'
        linters: [gosec]
      # Taint/overflow rules added in golangci-lint 2.11's gosec; the
      # flagged call sites predate the toolchain bump to Go 1.26 (hookyard
      # requires it) and are reviewed individually, not blanket-excluded.
      - text: 'G(115|118|120|204|703|705|706):'
        linters: [gosec]
