# Restores golangci-lint v1's default EXC0001 errcheck exclusions
# (dropped when this repo's config moved to v2 schema).
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - exhaustive
    - errorlint
    - nilerr
    - bodyclose
    - gosec
    - modernize
  settings:
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: '_test\.go'
        linters: [gosec]
      # Findings from gosec 2.11's new taint/overflow rules on code that
      # predates the Go 1.26 toolchain bump (hookyard requires it). Scoped to
      # the files that trip them, so a new file is still checked.
      - path: '^(hook/hook|parser/message_parser|runs/crewsource|runs/project|server/(auth|runs_terminal|runs_reply|runs_answer|peer_forward|pane_ws|dispatcher_launch|dispatcher_restart|runs_chat|runs_crewfeed|server)|tmux/client)\.go$'
        text: 'G(115|118|120|204|703|705|706):'
        linters: [gosec]
